# Production deploy: build the image, no bind mounts, configuration at runtime.
# Portainer: fill in the environment below, attach to your nginx network, deploy.

services:
  be:
    build:
      context: .
    image: otakudesu-be:latest
    container_name: otakudesu-be-v3
    ports:
      - "31421:3000"
    environment:
      # Anime (required)
      ANIME_BASE_URL: ${ANIME_BASE_URL:-https://otakudesu.blog}
      # Comic
      COMIC_BASE_URL: ${COMIC_BASE_URL:-https://kiryuuid.net}
      # Movie — without a token the movie endpoints return empty results
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-id-ID}
      MOVIE_EMBED_PROVIDERS: ${MOVIE_EMBED_PROVIDERS:-2embed,videasy,vidsrc}
      # Live TV
      IPTV_API_URL: ${IPTV_API_URL:-https://iptv-org.github.io/api}
      TV_COUNTRY: ${TV_COUNTRY:-ID}
      # Set this only when running more than one replica
      HLS_PROXY_SECRET: ${HLS_PROXY_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    restart: always

    # Hardening: the app only reads from disk and never writes outside /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: nginx_default
    external: true
