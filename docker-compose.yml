# Recommended production deploy (build image, no bind-mount, no Node entrypoint).
# Portainer: set BASEURL, attach to your nginx network, then deploy.

services:
  be:
    build:
      context: .
      args:
        BASEURL: ${BASEURL:-https://otakudesu.blog/}
    image: otakudesu-be:latest
    container_name: otakudesu-be-v2
    ports:
      - "31421:3000"
    environment:
      BASEURL: ${BASEURL:-https://otakudesu.blog/}
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: nginx_default
    external: true
