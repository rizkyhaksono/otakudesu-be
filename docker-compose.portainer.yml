# Paste/adapt this into Portainer Stacks.
# Key fix: override Node image ENTRYPOINT to avoid:
#   exec /usr/local/bin/docker-entrypoint.sh: permission denied
#
# Bind-mount mode still requires on the host path:
#   git pull && npm ci && npm run build
#
# Prefer the built-image mode in docker-compose.yml for production.

version: "3"

services:
  fe:
    image: node:24-alpine
    container_name: otakudesu-fe
    ports:
      - "32121:3000"
    environment:
      - NEXT_PUBLIC_BASE_ANIME_API_URL=https://api.otakudesu.natee.my.id/api
      - NEXT_PUBLIC_BASE_COMIC_API_URL=https://api.gami.natee.my.id/
      - NEXT_PUBLIC_BASE_MOVIE_API_URL=https://api.flix.natee.my.id/
    restart: always
    volumes:
      - /home/otakudesu-fe:/home/otakudesu-fe
    working_dir: /home/otakudesu-fe
    entrypoint: ["npm", "run", "start"]
    networks:
      - nginx_network

  be:
    image: node:24-alpine
    container_name: otakudesu-be-v2
    ports:
      - "31421:3000"
    environment:
      BASEURL: https://otakudesu.blog/
    restart: always
    volumes:
      - /home/otakudesu-be-v2:/home/otakudesu-be-v2
    working_dir: /home/otakudesu-be-v2
    entrypoint: ["npm", "run", "start"]
    networks:
      - nginx_network

networks:
  nginx_network:
    external: true
    name: nginx_default
