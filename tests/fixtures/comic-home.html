a. Ikatan itu membuka akses pada suara kolektif jamur dan rahasia lama tentang mengapa klan jamur terus bertikai. Saat kota permukaan mulai mengekstraksi cahaya bioluminesen untuk energi murah, keseimbangan ekosistem retak dan wabah spora beracun menyebar ke mana-mana.\nAru dipaksa keluar dari zona nyamannya untuk memimpin, bukan dengan paksaan, melainkan melalui empati dan kolaborasi lintas klan. Ia belajar menavigasi politik bawah tanah, ilmu mikologi praktis, dan ritual kuno yang selama ini dianggap mitos. Demi menyelamatkan rumahnya, Aru harus memadukan tradisi dan inovasi, menegosiasikan perdamaian dengan dunia permukaan, dan menerima gelar yang tidak pernah ia minta sebagai Raja Jamur yang baru.&quot;,&quot;status&quot;:&quot;Ongoing&quot;,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/manga\/rise-of-the-mushroom-king\/&quot;,&quot;poster&quot;:&quot;https:\/\/thumbnail.komiku.org\/new\/img\/images\/2026\/05\/13\/20260513171513_fe64053b88dc78ff_922212d9.webp?w=500&quot;,&quot;type&quot;:&quot;Manhua&quot;,&quot;author&quot;:&quot;-&quot;,&quot;artist&quot;:&quot;-&quot;,&quot;is_featured&quot;:0,&quot;rating&quot;:null,&quot;release_year&quot;:2026,&quot;views_count&quot;:238,&quot;created_at&quot;:&quot;2026-05-25T22:28:22.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T19:12:59.000000Z&quot;,&quot;genres&quot;:[{&quot;id&quot;:1,&quot;name&quot;:&quot;Action&quot;,&quot;slug&quot;:&quot;action&quot;,&quot;icon&quot;:&quot;\u2694\ufe0f&quot;,&quot;created_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:7172,&quot;genre_id&quot;:1}},{&quot;id&quot;:2,&quot;name&quot;:&quot;Adventure&quot;,&quot;slug&quot;:&quot;adventure&quot;,&quot;icon&quot;:&quot;\ud83d\uddfa\ufe0f&quot;,&quot;created_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:7172,&quot; , serta strategi kotor kompetitor. Kerja sama yang terpaksa dengan Eden pelan-pelan berubah jadi aliansi taktis saat mereka membongkar jaringan fitnah yang terhubung ke skandal Nara di masa lalu. Setiap langkah membawa risiko cancel baru dan taruhan reputasi. Ketika kebenaran menuntut harga yang lebih mahal dari sekadar trending, Nara dipaksa memilih antara formula viral yang dulu membuatnya berjaya atau integritas yang bisa membebaskan banyak pihak, termasuk dirinya sendiri.&quot;,&quot;status&quot;:&quot;Ongoing&quot;,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/manga\/the-scandal-maker-has-returned\/&quot;,&quot;poster&quot;:&quot;https:\/\/thumbnail.komiku.org\/new\/img\/images\/2026\/06\/13\/20260613151622_27c678516414cf77_67bed8fa.jpg?w=500&quot;,&quot;type&quot;:&quot;Manhwa&quot;,&quot;author&quot;:&quot;-&quot;,&quot;artist&quot;:&quot;-&quot;,&quot;is_featured&quot;:0,&quot;rating&quot;:&quot;9.0&quot;,&quot;release_year&quot;:2026,&quot;views_count&quot;:717,&quot;created_at&quot;:&quot;2026-06-13T08:03:17.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T13:40:23.000000Z&quot;,&quot;genres&quot;:[{&quot;id&quot;:4,&quot;name&quot;:&quot;Drama&quot;,&quot;slug&quot;:&quot;drama&quot;,&quot;icon&quot;:&quot;\ud83c\udfad&quot;,&quot;created_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:7256,&quot;genre_id&quot;:4}},{&quot;id&quot;:6,&quot;name&quot;:&quot;Fantasy&quot;,&quot;slug&quot;:&quot;fantasy&quot;,&quot;icon&quot;:&quot;\ud83e\ude84&quot;,&quot;created_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:7256,&quot;genre_id&quot;:6}},{&quot;id&quot;:37,&quot;name&quot;:&quot;Josei&quot;,&quot;slug&quot;:&quot;josei&quot;,&quot;icon&quot;:null,&quot;created_at&quot;:&quot;2026-03-23T15:38:06.000000Z&quot;,&quot;updated_at&quot;:&quot;2026- apter 62&quot;,&quot;slug&quot;:&quot;chapter-62&quot;,&quot;chapter_number&quot;:62,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/tsuihousha-shokudou-e-youkoso-welcome-to-cheap-restaurant-of-outcasts-chapter-62\/&quot;,&quot;content&quot;:null,&quot;views_count&quot;:2,&quot;created_at&quot;:&quot;2026-08-14T06:06:20.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T09:22:23.000000Z&quot;}},{&quot;id&quot;:2674,&quot;title&quot;:&quot;Lord Preston\u2019s Secret Tutor&quot;,&quot;slug&quot;:&quot;lord-prestons-secret-tutorlord-prestons-secret-tutor&quot;,&quot;synopsis&quot;:&quot;Saat Lord muda Cedric Preston nyaris kehilangan kursi di Majelis karena gagal ujian kenegaraan, ia merekrut tutor rahasia agar reputasinya tidak makin runtuh. Yang datang adalah Aria Vale, jenius dari kalangan biasa yang menyembunyikan identitasnya lewat kontrak hitam, mengajar taktik pemerintahan, retorika, dan etiket sihir di perpustakaan bawah tanah. Pelatihan intens penuh kode sandi, duel pena, dan simulasi sidang membuat Cedric perlahan membaca peta kekuasaan yang dipenuhi patronase dan jebakan.\nNamun rumor tentang \u201ctutor hantu\u201d menyebar, sementara Kanselir Kerajaan memburu dalang pamflet yang membongkar korupsi. Aria ternyata terkait masa lalu kelam sebuah keluarga bangsawan yang dikambinghitamkan, dan kebenaran itu bisa menggulingkan lebih dari satu kursi. Di tengah jam pelajaran yang berubah jadi strategi penyelamatan diri, Cedric harus memilih untuk bermain aman atau mempertaruhkan gelar demi melindungi orang yang mengubahnya. Puncaknya, ujian akhir beralih menjadi sidang publik, tempat rencana mereka mengungkap jaringan kecurangan sekaligus menentukan siapa yang layak memimpin.&quot;,&quot;status&quot;:&quot;Ongoing&quot;,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/manga\/lord-prestons-secret-tutor\/\/&quot;,&quot;poster&quot;:&quot;https:\/\/thumbnail.komiku.org\/new\/img\/images\/2026\/04\/15\/20260415161612_7ee0ec911535d005_58e2b523.webp?w=500&quot;, ot;created_at&quot;:&quot;2026-08-14T06:04:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T07:09:27.000000Z&quot;}}],&quot;latestNovelUpdates&quot;:[{&quot;id&quot;:1320,&quot;title&quot;:&quot;Pembunuh Iblis, Mendapatkan 60 Tahun Kultivasi Sejak Awal&quot;,&quot;slug&quot;:&quot;pembunuh-iblis-mendapatkan-60-tahun-kultivasi-sejak-awal&quot;,&quot;synopsis&quot;:&quot;&lt;p&gt;Benua Jiuzhou berisi era kekacauan dan iblis jahat, dihantui oleh makhluk misterius dan penuh dengan keluarga bela diri yang berseteru, tanah suci iblis, dan perjuangan tanpa akhir antara berbagai kekuatan. Konflik adalah hal yang konstan di seluruh dunia.&lt;\/p&gt; &lt;p&gt;Dalam kegelapan seperti itu, Gu Chen membuka matanya terhadap kenyataan ini.&lt;\/p&gt; &lt;p&gt;Pada saat yang sama, ia menemukan bahwa\/itu selama ia membunuh iblis dan hantu jahat ini, kekuatan Kultivasi-nya dapat terus meningkat.&lt;\/p&gt; &lt;p&gt;Membunuh Setan Tingkat Panik menghasilkan kultivasi senilai satu dekade.&lt;\/p&gt; &lt;p&gt;Membunuh Ghost Fiendish Tingkat Hantu membawa tiga puluh tahun kultivasi.&lt;\/p&gt; &lt;p&gt;\u2026&lt;\/p&gt; &lt;p&gt;Akhirnya, suatu hari, menatap segerombolan setan jahat dan grandmaster terkenal di dunia yang tak ada habisnya di jalannya, Gu Chen terkekeh ringan, \u201cApakah Anda mampu menahan tinju saya ini, yang dibebankan dengan 1600 tahun Kultivasi?\u201d&lt;\/p&gt;&quot;,&quot;status&quot;:&quot;end&quot;,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/pembunuh-iblis-mendapatkan-60-tahun-kultivasi-sejak-awal\/&quot;,&quot;api_base_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-json\/kiryuu\/v1&quot;,&quot;poster&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-content\/uploads\/cover-10-193x278-729469.jpg&quot;,&quot;type&quot;:&quot;Chinese&quot;,&quot;author&quot;:&quot;Flower On The Water That Reflects Moon&quot;,&quot;artist&quot;:null,&quot;is_featured&quot;:false,&quot;rating&quot;:0,&quot;release_year&quot;:null,&quot;views_count&quo uot;:95,&quot;name&quot;:&quot;Xianxia&quot;,&quot;slug&quot;:&quot;xianxia&quot;,&quot;icon&quot;:null,&quot;created_at&quot;:&quot;2026-06-16T03:52:55.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T03:52:55.000000Z&quot;,&quot;pivot&quot;:{&quot;novel_id&quot;:1320,&quot;genre_id&quot;:95}},{&quot;id&quot;:1553,&quot;name&quot;:&quot;China&quot;,&quot;slug&quot;:&quot;china&quot;,&quot;icon&quot;:null,&quot;created_at&quot;:&quot;2026-06-16T07:12:49.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T07:12:49.000000Z&quot;,&quot;pivot&quot;:{&quot;novel_id&quot;:1320,&quot;genre_id&quot;:1553}},{&quot;id&quot;:91,&quot;name&quot;:&quot;Tamat&quot;,&quot;slug&quot;:&quot;tamat&quot;,&quot;icon&quot;:null,&quot;created_at&quot;:&quot;2026-06-16T00:37:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-06-16T00:37:12.000000Z&quot;,&quot;pivot&quot;:{&quot;novel_id&quot;:1320,&quot;genre_id&quot;:91}}],&quot;last_chapter&quot;:{&quot;id&quot;:701760,&quot;novel_id&quot;:1320,&quot;title&quot;:&quot;Chapter 42&quot;,&quot;slug&quot;:&quot;chapter-42&quot;,&quot;chapter_number&quot;:1,&quot;position&quot;:1,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/pembunuh-iblis-mendapatkan-60-tahun-kultivasi-sejak-awal\/chapter-42\/&quot;,&quot;content&quot;:null,&quot;views_count&quot;:0,&quot;created_at&quot;:&quot;2026-08-14T01:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T01:39:14.000000Z&quot;}},{&quot;id&quot;:1319,&quot;title&quot;:&quot;Reinkarnasi Naga Iblis: Saya dikontrak oleh tuan yang seksi&quot;,&quot;slug&quot;:&quot;reinkarnasi-naga-iblis-saya-dikontrak-oleh-tuan-yang-seksi&quot;,&quot;synopsis&quot;:&quot;&lt;p&gt;Xu Yuan bertransmigrasi ke dunia paralel di mana semua orang menjadi tuan. Awalnya, dia pikir dia akan menjadi seorang lord juga. Yang mengejutkan, dia menjadi Dark Demonic Dragon, pahlawan pemula yang menunggu untuk dipanggil oleh seorang tuan. Dia juga membangunkan Sistem Kultivasi Dewa Naga.&lt;\/p&gt; &lt;p&gt;[Transformasi Kegelapan: Kamu bisa naik level dengan cepat dengan tetap berada dalam kegelapan.]&lt;\/p&gt; &lt;p&gt;[Slumber of the Dragon God: Bagi Dewa Naga, tidur berarti berada dalam kegelapan.]&lt;\/p&gt; &lt;p&gt;[Rejuvenation of the Demonic Dragon: Anda dapat menghidupkan kembali menggunakan kekuatan kegelapan. Poin atribut dasar Anda akan meningkat setiap kali Anda menghidupkan kembali.]&lt;\/p&gt; &lt;p&gt;[The Blade of the Hidden Wings: Ini adalah keterampilan AoE atribut gelap. Itu bisa memusnahkan semua musuh di dalam area efek.]&lt;\/p&gt; &lt;p&gt;[Melahap Tanpa Batas: Keterampilan musuhmu akan menjadi milikmu sekarang. Lepaskan keterampilan ini untuk melahap musuh Anda dan memperoleh keterampilan mereka.]&lt;\/p&gt; &lt;p&gt;\u2026&lt;\/p&gt; &lt;p&gt;Su Wan, seorang tuan yang cantik, tidak ragu bahwa\/itu dia bisa dengan mudah menjadi tuan yang paling kuat di alam semesta.&lt;\/p&gt; &lt;p&gt;Dia merasakan jantungnya berdetak kencang ketika dia pertama kali melihat pahlawan starternya menyilaukan di tengah cahaya pemanggilan yang berkedip.&lt;\/p&gt; &lt;p&gt;Tanpa sepengetahuannya, mimpi buruknya akan segera terungkap.&lt;\/p&gt; &lt;p&gt;Sementara pahlawan lain mengabdikan diri untuk berlatih siang dan malam untuk naik level, pahlawannya bermain-main dan tidak menunjukkan upaya untuk memperbaiki dirinya.&lt;\/p&gt; &lt;p&gt;Sementara pahlawan lain menyerbu ke markas musuh dan dengan gagah berani membunuh musuh mereka, pahlawannya bersembunyi di markas mereka dan tidur nyenyak.&lt;\/p&gt; &lt;p&gt;\u2026&lt;\/p&gt; &lt;p&gt;Seiring waktu berlalu, Su Wan perlahan menemukan bahwa\/itu ada lebih banyak pahlawannya daripada yang terlihat.&lt;\/p&gt;&quot;,&quot;status&quot;:&quot;end&quot;,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/reinkarnasi-naga-iblis-saya-dikontrak-oleh-tuan-yang-seksi\/&quot;,&quot;api_base_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-json\/kiryuu\/v1&quot;,&quot;poster&quot;:&quot;https:\/\/ \u3010Opsi Dua: Tidak (Menolak untuk memasuki Dunia Ashen tetapi merasa sia-sia untuk segera tidur, jadi putuskan untuk begadang sepanjang malam bermain game dan berkultivasi, harganya mungkin tidur berlebihan dan terlambat ke sekolah besok.)\u3011&lt;\/p&gt; &lt;p&gt;\u3010Opsi Tiga: Abaikan untuk Saat Ini (Disarankan bagi mereka yang mengalami kesulitan membuat keputusan, Anda akan tersiksa apakah akan memasuki Dunia Ashen dan hanya akan tertidur pada pukul dua pagi, harganya mungkin terlalu banyak tidur dan terlambat ke sekolah besok.)\u3011&lt;\/p&gt; &lt;p&gt;ps: Protagonisnya tidak suci, tegas dan kejam, dan berpikir berbeda dari orang kebanyakan. Harap menahan diri dari kritik jika ini tidak sesuai dengan selera Anda.&lt;\/p&gt;&quot;,&quot;status&quot;:&quot;end&quot;,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/dewa-ashen\/&quot;,&quot;api_base_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-json\/kiryuu\/v1&quot;,&quot;poster&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-content\/uploads\/cover-7-193x278-723005.jpg&quot;,&quot;type&quot;:&quot;Chinese&quot;,&quot;author&quot;:&quot;Just call the polar bear&quot;,&quot;artist&quot;:null,&quot;is_featured&quot;:false,&quot;rating&quot;:0,&quot;release_year&quot;:null,&quot;views_count&quot;:10,&quot;first_chapter_slug&quot;:&quot;chapter-1&quot;,&quot;first_chapter_title&quot;:&quot;Chapter 1&quot;,&quot;first_chapter_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/dewa-ashen\/chapter-1\/&quot;,&quot;last_synced_at&quot;:&quot;2026-08-14T01:40:47.000000Z&quot;,&quot;last_api_synced_at&quot;:&quot;2026-08-14T01:40:47.000000Z&quot;,&quot;api_sync_requested_at&quot;:null,&quot;api_sync_status&quot;:&quot;success&quot;,&quot;api_sync_error&quot;:null,&quot;created_at&quot;:&quot;2026-08-10T12:42:07.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T01:40:47.000000Z&quot;,&quot;genres&quot;:[{&quot;id&quot;:2,&quot;name&quot;:&quot;Adventure&quot;,&quot;slug&quot;:&quot;adve m tiga hari\u2026 Terjebak dalam masyarakat yang tidak manusiawi ini, tujuan awalnya hanya untuk menjadi orang kaya dan melewati hari-harinya dengan relatif aman. \u2026 Bertahun-tahun kemudian, Xu Qian mengingat peristiwa masa lalu. Musuh dan teman-temannya sudah mati, tidak ada yang tersisa dari mereka kecuali tulang belulang. Sungai Yangtze yang bergulung mengalir ke timur saat ombak menghanyutkan para pahlawan. Sukses atau gagal, salah atau benar; tidak terlalu berarti, mungkin? Gunung-gunung yang subur tetap ada sementara matahari terbenam setiap malam.&lt;\/p&gt;&quot;,&quot;status&quot;:&quot;end&quot;,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/pasukan-malam-dafeng\/&quot;,&quot;api_base_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-json\/kiryuu\/v1&quot;,&quot;poster&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-content\/uploads\/DNS-193x278-723006.jpg&quot;,&quot;type&quot;:&quot;Chinese&quot;,&quot;author&quot;:&quot;Newspaper Boy&quot;,&quot;artist&quot;:null,&quot;is_featured&quot;:false,&quot;rating&quot;:0,&quot;release_year&quot;:null,&quot;views_count&quot;:11,&quot;first_chapter_slug&quot;:&quot;chapter-1&quot;,&quot;first_chapter_title&quot;:&quot;Chapter 1&quot;,&quot;first_chapter_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/pasukan-malam-dafeng\/chapter-1\/&quot;,&quot;last_synced_at&quot;:&quot;2026-08-14T01:40:42.000000Z&quot;,&quot;last_api_synced_at&quot;:&quot;2026-08-14T01:40:42.000000Z&quot;,&quot;api_sync_requested_at&quot;:null,&quot;api_sync_status&quot;:&quot;success&quot;,&quot;api_sync_error&quot;:null,&quot;created_at&quot;:&quot;2026-08-10T12:41:40.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T01:40:42.000000Z&quot;,&quot;genres&quot;:[{&quot;id&quot;:3,&quot;name&quot;:&quot;Comedy&quot;,&quot;slug&quot;:&quot;comedy&quot;,&quot;icon&quot;:&quot;\ud83d\ude02&quot;,&quot;created_at&quot;:&quot;2026-03-23T06:39:14.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-03-23T06:39:14.00000 uot;,&quot;content&quot;:null,&quot;views_count&quot;:2,&quot;created_at&quot;:&quot;2026-08-10T12:41:41.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-13T23:22:58.000000Z&quot;}},{&quot;id&quot;:1312,&quot;title&quot;:&quot;Penjinakan Binatang: Dewa dan Iblis Pun Kubiakkan&quot;,&quot;slug&quot;:&quot;penjinakan-binatang-dewa-dan-iblis-pun-kubiakkan&quot;,&quot;synopsis&quot;:&quot;&lt;p&gt;Wild Savage Ape \u2192 Eight-Arms Mad Ape \u2192 Primordial Grey Ape\u2026.&lt;br \/&gt; Setelah Chen Fan dan puluhan ribu orang telah menyeberang ke dunia Guardian Beast, ia menemukan bahwa\/itu ia dapat melihat jalur evolusi dan metode evolusi untuk Guardian Beast.&lt;br \/&gt; The Guardian Beast yang dia kultivasi bisa membantunya dalam mengumpulkan energi kosong ketika mereka membunuh monster!&lt;br \/&gt; Ketika Golden Gyrfalcon membunuh lima belas bug berkepala dua level 12, System Energy +450 poin diberikan.&lt;br \/&gt; Ketika Wild Savage Ape membunuh delapan level 11 Wind Wolves, System Energy +166 poin diberikan\u2026.&lt;br \/&gt; Energi dapat digunakan untuk meningkatkan Star Power, meningkatkan kekuatan mental, membuka meridian, dan bahkan\u2026.duplikat keterampilan Guardian Beasts\u2019 lainnya!&lt;br \/&gt; Keterampilan apa yang telah dibangunkan Guardian Beast Anda setelah menerobos?&lt;br \/&gt; Permisi, saya benar-benar tidak peduli apakah Guardian Beast saya telah membangkitkan keterampilan apa pun karena semua keterampilan Guardian Beasts\u2019 Anda dapat menjadi keterampilan Guardian Beast saya.&lt;br \/&gt; Sejak saat itu, Chen Fan menjadi sangat suka memelihara binatang buas.&lt;\/p&gt; &lt;p&gt;\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014&lt;\/p&gt; &lt;p&gt;Di dunia monster\u2026.&lt;br \/&gt; Gunung, sungai, dan tanaman semuanya dapat berubah dan terbentuk, dan bahkan pedang antik dapat menumbuhkan roh pedang.&lt;br \/&gt; Iblis, monster, raksasa, elf, ras serangga\u2026\u2026telah mendorong ruang hidup manusia sampai batasnya.&lt;br \/&gt; Hanya ketika Beastmaster, yang bisa membentuk kontrak dengan monster, muncul bahwa\/itu umat manusia memiliki awal yang baru.&lt;br \/&gt; Dua ribu tahun kemudian, Chen Fan membuat penampilannya.&lt;br \/&gt; Dia memiringkan kepalanya sedikit ke atas, berbicara kepada Guardian Beast-nya\u2026.&lt;br \/&gt; Berabad-abad kemudian, jika saya menjadi legenda, kisah saya pasti akan menyertakan Anda.&lt;br \/&gt; Berabad-abad kemudian, jika Anda menjadi legenda, saya berharap bahwa\u2026\u2026kisah Anda juga termasuk saya.&lt;br \/&gt; Dengan saya di Tang Country, kami tidak dapat ditaklukkan!&lt;br \/&gt; Dengan saya di Blue Star, bahkan Dewa Iblis harus melarikan diri!&lt;\/p&gt;&quot;,&quot;status&quot;:&quot;end&quot;,&quot;source_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/penjinakan-binatang-dewa-dan-iblis-pun-kubiakkan\/&quot;,&quot;api_base_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-json\/kiryuu\/v1&quot;,&quot;poster&quot;:&quot;https:\/\/novel.kiryuuid.net\/wp-content\/uploads\/beast-taming-i-723004.jpg&quot;,&quot;type&quot;:&quot;Chinese&quot;,&quot;author&quot;:&quot;Colorless Sea&quot;,&quot;artist&quot;:null,&quot;is_featured&quot;:false,&quot;rating&quot;:0,&quot;release_year&quot;:null,&quot;views_count&quot;:270,&quot;first_chapter_slug&quot;:&quot;chapter-1&quot;,&quot;first_chapter_title&quot;:&quot;Chapter 1&quot;,&quot;first_chapter_url&quot;:&quot;https:\/\/novel.kiryuuid.net\/novelmanga\/penjinakan-binatang-dewa-dan-iblis-pun-kubiakkan\/chapter-1\/&quot;,&quot;last_synced_at&quot;:&quot;2026-08-14T01:40:32.000000Z&quot;,&quot;last_api_synced_at&quot;:&quot;2026-08-14T01:40:32.000000Z&quot;,&quot;api_sync_requested_at&quot;:null,&quot;api_sync_status&quot;:&quot;success&quot;,&quot;api_sync_error&quot;:null,&quot;created_at&quot;:&quot;2026-08-10T12:41:12.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-14T14:14:05.000000Z&quot;,&quot;genres&quot;:[{&quot;id&quot;:6,&quot;name&quot;:&quot;Fantasy&quot;,&quo
