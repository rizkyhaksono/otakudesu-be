name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # `bun test` with no arguments discovers every `*.test.ts` file, which
      # includes `tests/live/` — the opt-in suite that hits real upstreams.
      # `bun run test` is scoped to the fixture-based directories only, so CI
      # stays deterministic even when an upstream site is slow or down.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          ANIME_BASE_URL: https://otakudesu.blog
