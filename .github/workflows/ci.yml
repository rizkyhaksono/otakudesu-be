name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Unit tests are fixture-based and never touch the network, so this stays
      # deterministic even when an upstream site is down.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          ANIME_BASE_URL: https://otakudesu.blog
